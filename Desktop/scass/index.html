<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Profile</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <header>

        <img src="media/profile-1.jpeg" alt="">

    </header>
    <main>
        <div class="informations">
            <div class="simple-info">
                <h1>Spike Spiegel</h1>
                <h2>Bounty Hunter</h2>
                <div class="simple_info_location">
                    <i class="fa-solid fa-location-dot"></i>
                    <p>Mars</p>
                </div>

            </div>
            <div class="info_btn">
                <button>Exchange Contact</button>
            </div>
        </div>

        <div class="connect">
            <h1>Let's Connect</h1>

            <div>
                <img src="media/ig.png" alt="" height="50">
                <img src="media/lk.png" alt="" height="70">
            </div>

        </div>

        <div class="our-team">
            <div class="card">
                <img src="media/jet.png" alt="" height="200" width="200">
                <h1>Jet Black</h1>
                <h3>Captain</h3>
            </div>

            <div class="card">
                <img src="media/faye.jpeg" alt="" height="200" width="200">
                <h1>Faye Valentine</h1>
                <h3>Gambler</h3>
            </div>
            <div class="card">
                <img src="media/edword.png" alt="" height="200" width="200">
                <h1>Edward (Ed)</h1>
                <h3>Master Hacker</h3>
            </div>
        </div>
    </main>


</body>

</html>
