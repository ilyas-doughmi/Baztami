<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <title>Historique des opérations</title>
  <style>
    :root {
      --primary-text: #324A5F;
      --secondary-text: #0C1821;
    }

    body {
      color: var(--primary-text);
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      color: var(--secondary-text);
    }
  </style>
</head>
<body class="font-['Inter'] bg-gray-50">
  <header>
    <div class="flex justify-between items-center relative px-4 py-3 md:px-10">
      <div id="Hamburger-menu">
        <button id="menu-btn" class="md:hidden">
          <i id="menu-icon" class="fa-solid fa-bars"></i>
        </button>

        <div id="menu" class="left-4 absolute border-2 border-[#324A5F] mt-2 flex flex-col gap-3 bg-gray-100 p-4 rounded-3xl shadow-md transform scale-y-0 origin-top transition-transform duration-300 ease-out w-56 z-20">
          <div class="flex gap-2 items-center">
            <i class="fa-solid fa-gauge text-blue-600"></i>
            <a href="compte.html" class="py-1 hover:text-green-600">Comptes</a>
          </div>
          <div class="flex gap-2 items-center">
            <i class="fa-solid fa-credit-card text-purple-500"></i>
            <a href="cartes.html" class="py-1 hover:text-green-600">Cartes</a>
          </div>
          <div class="flex gap-2 items-center">
            <i class="fa-solid fa-money-bill-transfer text-green-600"></i>
            <a href="virement.html" class="py-1 hover:text-green-600">Virements</a>
          </div>
          <div class="flex gap-2 items-center">
            <i class="fa-solid fa-users text-orange-500"></i>
            <a href="benificaires.html" class="py-1 hover:text-green-600">Bénéficiaires</a>
          </div>
          <div class="flex gap-2 items-center">
            <i class="fa-solid fa-clock-rotate-left text-[#324A5F]"></i>
            <a href="historiques.html" class="py-1 hover:text-green-600">Historique</a>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <img src="../../media/ycdbanklogo-noBG.png" style="width: 59px; height: 50px;">
        <h2 class="font-medium text-lg">YCD Bank</h2>
      </div>

      <nav class="hidden md:flex items-center gap-6 text-sm font-semibold text-[#324A5F]">
        <a href="compte.html" class="hover:text-[#0C1821]">Comptes</a>
        <a href="cartes.html" class="hover:text-[#0C1821]">Cartes</a>
        <a href="virement.html" class="hover:text-[#0C1821]">Virements</a>
        <a href="benificaires.html" class="hover:text-[#0C1821]">Bénéficiaires</a>
        <a href="historiques.html" class="hover:text-[#0C1821] text-[#0C1821]">Historique</a>
      </nav>

      <div id="user-notif" class="flex gap-4">
        <button id="notification-bell-btn">
          <i id="notification-bell-icon" class="fa-regular fa-bell fa-lg"></i>
        </button>
        <div class="relative">
          <button id="user-circle-btn">
            <i id="user-circle" class="fa-regular fa-circle-user fa-lg"></i>
          </button>
          <div id="DECONNECT" class="absolute right-0 border-2 border-[#324A5F] mt-2 bg-gray-100 p-3 rounded-3xl shadow-md transform scale-y-0 origin-top transition-transform duration-300 ease-out w-48">
            <div class="flex gap-2 items-center">
              <button id="DECONNECT-btn">
                <i id="deconnect-icon" class="fa-solid fa-toggle-on text-green-600"></i>
              </button>
              <p class="font-semibold text-sm">Déconnexion</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 md:px-10 py-8 space-y-6">
    <section class="bg-white rounded-3xl shadow-sm p-6 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
      <div>
        <p class="text-sm text-gray-500">Historique des opérations</p>
        <h1 class="text-2xl font-bold flex items-center gap-2">
          Mes opérations
          <span id="history-count" class="text-base font-semibold text-[#324A5F] bg-[#324A5F]/10 px-3 py-1 rounded-full">0</span>
        </h1>
      </div>
      <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
        <select id="history-filter" class="border border-[#324A5F] rounded-3xl px-4 py-2 text-sm focus:outline-[#324A5F] w-full md:w-auto">
          <option value="all">Toutes les opérations</option>
        </select>
      
      </div>
    </section>

    <div id="history-empty" class="text-center text-gray-500 py-10 hidden">
      Aucune opération à afficher pour le moment.
    </div>

    <div id="history-list" class="space-y-4"></div>
    <div id="history-pagination" class="flex justify-between items-center mt-6 bg-white rounded-3xl shadow-sm px-4 py-3 hidden">
      <button id="history-prev" class="border border-[#324A5F] rounded-2xl px-4 py-2 text-sm text-[#324A5F] disabled:opacity-50 disabled:cursor-not-allowed">Précédent</button>
      <span id="history-page" class="text-sm font-semibold text-[#0C1821]">Page 1</span>
      <button id="history-next" class="border border-[#324A5F] rounded-2xl px-4 py-2 text-sm text-[#324A5F] disabled:opacity-50 disabled:cursor-not-allowed">Suivant</button>
    </div>
  </main>

  <script src="../js/data.js"></script>
  <script src="../js/historiques.js"></script>
</body>
</html>
