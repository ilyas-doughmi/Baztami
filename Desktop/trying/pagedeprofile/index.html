<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page de Profil - Médecin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <header>
        <div class="h-left">
            <i class="fa-solid fa-arrow-left"></i>
        </div>
        <div class="h-middle">
            <h1>Doctor's Profile</h1>
            <h5>Patient time 8:00am - 5:00pm</h5>
        </div>

        <div class="h-right">
            <div id="img-bg">
                            <img src="media/image.png" alt="" height="50" width="50">

            </div>
        </div>
    </header>

    <main>
        <div class="main_top">
            <div class="main_top_content">
                <div class="mtc_left">
                    <h1>Dr. Terry Aminoff</h1>
                    <h5>Neurologists Specialist</h5>
                </div>
                <div class="mtc_right">
                    <button>Request</button>
                </div>
            </div>
        </div>

        <div class="main_rating">
            <div class="main_rating_content">
                <div class="rate">
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                </div>
                <div class="rate_info">
                    <h1>4 Out of 5</h1>
                    <h4>340 Patient review</h4>
                </div>
            </div>
        </div>

        <div class="main_contact">
            <div class="contact_content">
                <div class="card">
                    <i class="fa-solid fa-video"></i>
                </div>
                <div class="card card2">
                    <i class="fa-solid fa-phone"></i>
                </div>
                <div class="card card3">
                    <i class="fa-solid fa-message"></i>
                </div>
            </div>
        </div>

        <div class="main_information">
            <div class="information_content">
                    <div class="inf_card card1">
                        <i class="fas fa-wheelchair"></i>
                        <h1>500+</h1>
                        <h4>Successful Patients</h4>
                    </div>
                      <div class="inf_card inf_card-card2">
                        <i class="fas fa-microscope"></i>
                        <h1>10 Years</h1>
                        <h4>Experience</h4>
                    </div>
                      <div class="inf_card inf_card-card3">
                        <i class="fa-solid fa-droplet"></i>
                        <h1>28+</h1>
                        <h4>Successful OT</h4>
                    </div>
                      <div class="inf_card inf_card-card4">
                        <i class="fa-solid fa-file"></i>
                        <h1>8+</h1>
                        <h4>Certified Acheived</h4>
                    </div>
                </div>
            </div>
            <button id="request_btn">Request For Appointement</button>
        </div>
    </main>
</body>

</html>
